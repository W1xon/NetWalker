<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWalker — Комната</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/10.0.11/signalr.min.js"></script>
    <script src="/js/room-details.js" defer></script>
    <script src="/js/roomHubChat.js" defer></script>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-top">
            <a href="/dashboard" class="logo">Net<span>Walker</span></a>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link">
                    <span class="nav-icon">←</span> К списку комнат
                </a>
            </nav>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>Комната: <span id="room-code-title" style="font-family: var(--font-mono); color: #a5b4fc;">------</span></h1>
                <p>Статус сессии: <span id="room-status-badge" class="room-badge badge-lobby">Загрузка...</span></p>
            </div>
            <input type="button" id="leave-room-btn" value="Покинуть комнату" class="btn-danger" />
        </div>

        <div class="room-content-grid">
            <!-- Левая колонка: статы и игроки -->
            <div class="room-main-info">
                <div class="stats-bar">
                    <div class="stat-item">
                        <label>Макс. игроков</label>
                        <span id="stat-max-players">0</span>
                    </div>
                    <div class="stat-item">
                        <label>Игроков в сети</label>
                        <span id="stat-current-players">0</span>
                    </div>
                    <div class="stat-item">
                        <label>Создана</label>
                        <span id="stat-created-time" style="font-size: 1.2rem;">--:--</span>
                    </div>
                </div>

                <h2 class="section-title">Игроки в сессии</h2>
                <div class="room-grid" id="players-grid">
                    <!-- Карточки игроков генерируются скриптом -->
                </div>
            </div>

            <!-- Правая колонка: изолированный чат -->
            <div class="chat-container">
                <h3>Терминал сообщений</h3>
                <div id="chatroom" class="chat-messages">
                    <!-- Сообщения чата -->
                </div>
                <div class="chat-input-area" id="inputForm">
                    <input type="text" id="message" placeholder="Напишите сообщение..." autocomplete="off" />
                    <input type="button" id="sendBtn" value="Отправить" />
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
