<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWalker — Авторизация</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/auth.js" defer></script>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <h1 id="auth-title">Вход в систему</h1>

        <form id="auth-form">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="Name" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="Password" required autocomplete="current-password">
            </div>

            <div id="error-message" class="error-message"></div>

            <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Войти</button>
        </form>

        <div class="auth-toggle">
            <span id="toggle-mode-text">Ещё нет аккаунта? </span>
            <button type="button" id="toggle-mode-btn">Зарегистрироваться</button>
        </div>
    </div>
</div>
</body>
</html>
