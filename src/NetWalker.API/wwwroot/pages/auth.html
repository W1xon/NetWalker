<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NetWalker - Авторизация</title>
</head>
<body>
<h1 id="auth-title">Вход в систему</h1>

<form id="auth-form">
    <div>
        <label for="name">Имя пользователя:</label>
        <input type="text" id="name" name="name" required autocomplete="username">
    </div>

    <div>
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>

    <button type="submit" id="submit-btn">Войти</button>
</form>

<div id="error-message" style="color: red;"></div>

<hr>
<p id="toggle-mode-text">
    Ещё нет аккаунта? <a href="#" id="toggle-mode-btn">Зарегистрироваться</a>
</p>

<script src="/js/auth.js"></script>
</body>
</html>
