<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWalker — Профиль игрока</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/auth.js" defer></script>
    <script src="/js/profile.js" defer></script>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-top">
            <a href="/" class="logo">Net<span>Walker</span></a>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link">🎮 Активные комнаты</a>
                <a href="/dashboard" class="sidebar-link">➕ Создать сессию</a>
                <a href="/profile" class="sidebar-link active">📊 Мой профиль</a>
            </nav>
        </div>

        <div class="sidebar-userbar">
            <div class="userbar-info">
                <span class="userbar-nick skeleton user-nick" id="sidebar-user-nick">PlayerName</span>
                <span class="userbar-status">Online</span>
            </div>
            <button id="logout-btn" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">Выйти</button>
        </div>
    </aside>

    <main class="main-content">
        <section class="profile-header-card" style="background: var(--bg-card); padding: 24px; border-radius: var(--radius-md); margin-bottom: 24px; border: 1px solid var(--border-color);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
                <div>
                    <h1 class="user-nick" id="user-nick" style="margin: 0 0 8px 0; font-size: 28px;">PlayerName</h1>
                    <p style="color: var(--text-secondary); margin: 0; font-size: 14px;">
                        ID: <code id="user-id" style="background: var(--bg-input); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color);">00000000-0000-0000-0000-000000000000</code>
                    </p>
                </div>
                <div style="text-align: right;">
                    <span style="color: var(--text-secondary); font-size: 13px;">Дата регистрации</span>
                    <div id="user-created-time" style="font-weight: bold; margin-top: 4px;">01.01.1970 00:00</div>
                </div>
            </div>
        </section>

        <h2 style="margin-bottom: 16px;">Статистика CmdWalker</h2>
        <div class="stats-bar" style="margin-bottom: 32px;">
            <div class="stat-item">
                <label>Сыграно игр</label>
                <span id="stat-total-games">0</span>
            </div>
            <div class="stat-item">
                <label>Общее время (мин)</label>
                <span id="stat-total-playtime">0</span>
            </div>
            <div class="stat-item">
                <label>Самая долгая сессия (мин)</label>
                <span id="stat-longest-session">0</span>
            </div>
        </div>

        <h2 style="margin-bottom: 16px;">Безопасность</h2>
        <section class="profile-section" style="background: var(--bg-card); padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border-color); max-width: 500px;">
            <form id="change-password-form">
                <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 18px;">Смена пароля</h3>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="current-password">Текущий пароль</label>
                    <input type="password" id="current-password" name="CurrentPassword" required style="width: 100%;">
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="new-password">Новый пароль</label>
                    <input type="password" id="new-password" name="NewPassword" required style="width: 100%;">
                </div>

                <div id="profile-error-message" class="error-message" style="margin-bottom: 12px;"></div>
                <div id="profile-info-message" class="info-message" style="margin-bottom: 12px;"></div>

                <button type="submit" class="btn btn-primary">Обновить пароль</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
