<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWalker — Хаб сессий</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/auth.js" defer></script>
    <script src="/js/rooms.js" defer></script>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-top">
            <a href="/" class="logo">Net<span>Walker</span></a>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link active">
                    <span class="nav-icon">🎮</span> Активные комнаты
                </a>
                <a href="#" id="create-room-trigger" class="sidebar-link">
                    <span class="nav-icon">➕</span> Создать сессию
                </a>
                <a href="/profile" class="sidebar-link">
                    <span class="nav-icon">👤</span> Мой профиль
                </a>
            </nav>
        </div>

        <div class="sidebar-userbar">
            <div class="userbar-info">
                <span class="userbar-nick skeleton user-nick" id="sidebar-user-nick">PlayerName</span>
                <span class="userbar-status">Online</span>
            </div>
            <a href="/profile" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">Профиль</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>Хаб сессий</h1>
                <p>Активные игровые комнаты и статистика сервера CmdWalker</p>
            </div>
            <button id="create-room-trigger" class="btn btn-primary" onclick="document.getElementById('create-room-modal').style.display='flex'">
                Создать комнату
            </button>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <label>Активных комнат</label>
                <span id="stat-active-sessions">0</span>
            </div>
            <div class="stat-item">
                <label>Игроков онлайн</label>
                <span id="stat-players-online">0</span>
            </div>
            <div class="stat-item">
                <label>Ожидают хоста</label>
                <span id="stat-waiting-host">0</span>
            </div>
        </div>

        <h2 class="section-title">Список открытых лобби</h2>
        <div class="room-grid" id="room-grid"></div>
    </main>
</div>

<!-- Модальное окно создания комнаты -->
<div id="create-room-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Создание комнаты</h3>
        <div class="form-group">
            <label for="max-players-input">Максимум игроков (от 2 до 16):</label>
            <input type="number" id="max-players-input" value="4" min="2" max="16">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 24px;">
            <button id="btn-submit-create" class="btn btn-primary" style="flex: 1;">Создать</button>
            <button id="btn-close-modal" class="btn btn-secondary" style="flex: 1;">Отмена</button>
        </div>
    </div>
</div>
</body>
</html>
