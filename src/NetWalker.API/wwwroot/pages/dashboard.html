<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWalker — Хаб сессий</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/auth.js" defer></script>
    <script src="/js/rooms.js" defer></script>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-top">
            <a href="/" class="logo">Net<span>Walker</span></a>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link active">
                    Активные комнаты
                </a>
                <a href="#" id="create-room-trigger" class="sidebar-link">
                    Создать сессию
                </a>
                <a href="/profile" class="sidebar-link">
                    Мой профиль
                </a>
            </nav>
        </div>

        <div class="sidebar-userbar">
            <div class="userbar-info">
                <span class="userbar-nick skeleton user-nick" id="sidebar-user-nick">PlayerName</span>
                <span class="userbar-status">Online</span>
            </div>
            <a href="/profile" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">Профиль</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Хаб сессий</h1>
            <p>Активные игровые комнаты и статистика сервера</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <label>Активных сессий</label>
                <span id="stat-active-sessions">0</span>
            </div>
            <div class="stat-item">
                <label>Игроков онлайн</label>
                <span id="stat-players-online">0</span>
            </div>
            <div class="stat-item">
                <label>Ожидают хоста</label>
                <span id="stat-waiting-host">0</span>
            </div>
        </div>

        <h2 class="section-title">Список комнат</h2>
        <p style="color: var(--text-secondary); margin-top: -8px; margin-bottom: 20px;">Подключайтесь к существующей сессии или заберите Host Ticket для своей игры.</p>

        <div class="room-grid" id="room-grid"></div>
    </main>
</div>

<div id="create-room-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 9999;">
    <div style="background: #1e1e1e; padding: 25px; border-radius: 8px; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); color: #fff;">
        <h3 style="margin-top:0; margin-bottom: 15px;">Создание комнаты</h3>
        <label style="display:block; margin-bottom: 5px; color: #aaa;">Максимум игроков:</label>
        <input type="number" id="max-players-input" value="4" min="2" max="16" style="width:100%; padding:8px; margin-bottom:20px; box-sizing: border-box; background: #2a2a2a; border: 1px solid #444; color: #fff;">
        <div style="display:flex; justify-content:space-between; gap: 10px;">
            <button id="btn-submit-create" class="btn btn-primary" style="flex:1;">Создать</button>
            <button id="btn-close-modal" class="btn btn-secondary" style="flex:1;">Отмена</button>
        </div>
    </div>
</div>
</body>
</html>
